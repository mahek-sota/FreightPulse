name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest  # Docker is available on GitHub-hosted runners (testcontainers)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: integration + API tests with coverage
        run: >
          uv run pytest tests -q
          --cov=freightpulse --cov-report=term
          --cov-fail-under=0
      - name: coverage gate (domain + processing >= 80%)
        run: >
          uv run coverage report
          --include="src/freightpulse/domain/*,src/freightpulse/processing/*"
          --fail-under=80
