global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # DNS discovery returns every replica, so `docker compose up --scale processor=3` is scraped too.
  - job_name: processor
    dns_sd_configs:
      - names: [processor]
        type: A
        port: 9100
  - job_name: alert-sink
    dns_sd_configs:
      - names: [alert-sink]
        type: A
        port: 9101
  - job_name: jobs
    dns_sd_configs:
      - names: [jobs]
        type: A
        port: 9102
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
