[project]
name = "freightpulse"
version = "0.1.0"
description = "Near real-time freight visibility data platform: Kafka (Redpanda) -> stream processor -> PostgreSQL -> FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.118",
    "testcontainers>=4.8",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
freightpulse-sim = "freightpulse.simulator.cli:main"
freightpulse-processor = "freightpulse.processing.processor:main"
freightpulse-alert-sink = "freightpulse.processing.alert_sink:main"
freightpulse-jobs = "freightpulse.processing.jobs:main"
freightpulse-dlq-replay = "freightpulse.processing.dlq_replay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freightpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PT", "TID", "ARG"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults

[tool.ruff.lint.per-file-ignores]
"src/freightpulse/domain/reference_data.py" = ["E501"]  # one facility per line reads best
"src/freightpulse/api/page.py" = ["E501"]  # embedded HTML/JS
"src/freightpulse/storage/seed_large.py" = ["E501"]  # long COPY column lists
"src/freightpulse/perf/*.py" = ["E501"]  # SQL text and markdown templates
"tests/**" = ["ARG001", "ARG002", "ARG005", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers: Postgres + Redpanda)",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
    # Starlette nudges towards httpx2; FastAPI's TestClient still uses httpx (spec stack).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/freightpulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
